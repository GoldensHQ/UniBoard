<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- UniBoard logo: clipboard + "U", dark theme -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2430"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4F8CFF"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Rounded app-tile background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none"
        stroke="#2A3242" stroke-width="4"/>

  <!-- Clipboard body -->
  <g filter="url(#shadow)">
    <rect x="140" y="118" width="232" height="296" rx="28" fill="#F4F6FA"/>
    <rect x="140" y="118" width="232" height="296" rx="28" fill="none"
          stroke="#D8DEE9" stroke-width="4"/>
    <!-- Top clip -->
    <rect x="216" y="96" width="80" height="46" rx="14" fill="url(#accent)"/>
    <rect x="232" y="112" width="48" height="14" rx="7" fill="#FFFFFF" opacity="0.55"/>
    <!-- Text lines -->
    <rect x="172" y="196" width="168" height="14" rx="7" fill="#C9D2E0"/>
    <rect x="172" y="228" width="168" height="14" rx="7" fill="#D5DCE8"/>
    <rect x="172" y="260" width="120" height="14" rx="7" fill="#D5DCE8"/>
    <!-- Big U -->
    <path d="M204 300 v46 a52 52 0 0 0 104 0 v-46"
          fill="none" stroke="url(#accent)" stroke-width="26" stroke-linecap="round"/>
  </g>
</svg>
